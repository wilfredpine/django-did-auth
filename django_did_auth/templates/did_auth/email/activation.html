<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Activate your account</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #eee; border-radius: 12px;">
        <h2>Hi {{ user.first_name|default:user.email }},</h2>
        
        <p>Thank you for registering! Please click the button below to activate your account:</p>
        
        <a href="{{ activation_link }}" 
           style="display: inline-block; background: #4f46e5; color: white; padding: 14px 28px; 
                  text-decoration: none; border-radius: 8px; font-weight: 600; margin: 20px 0;">
            Activate My Account
        </a>
        
        <p style="color: #666; font-size: 0.95rem;">
            This link will expire in {{ expiry|default:24 }} hours.
        </p>
        
        <p>If you didn't register, please ignore this email.</p>
        
        <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
        <p style="font-size: 0.9rem; color: #888;">Powered by django_did_auth</p>
    </div>
</body>
</html>
