{% extends "did_auth/base.html" %}
{% block title %}Verification Sent{% endblock %}

{% block content %}
<div class="text-center space-y-6 py-12">
    <div class="mx-auto w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center">
        <span class="text-4xl">📧</span>
    </div>
    
    <h2 class="text-3xl font-semibold text-gray-900">Check your email</h2>
    <p class="text-gray-600 max-w-sm mx-auto">
        We've sent a verification link to your email address. 
        Please click the link to activate your account.
    </p>

    <div class="pt-6">
        <a href="{% url 'did_auth:login' %}" 
           class="inline-flex items-center text-blue-600 hover:text-blue-500 font-medium">
            ← Back to login
        </a>
    </div>
</div>
{% endblock %}
