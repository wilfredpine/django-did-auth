{% extends "did_auth/base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="text-center">
        <h2 class="text-3xl font-semibold text-gray-900">Forgot your password?</h2>
        <p class="mt-3 text-gray-600">No worries, we'll send you reset instructions.</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
            {{ form.email }}
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-2xl transition-all">
            Send reset link
        </button>
    </form>

    <div class="text-center">
        <a href="{% url 'did_auth:login' %}" class="text-blue-600 hover:text-blue-500 text-sm font-medium">
            ← Back to login
        </a>
    </div>
</div>
{% endblock %}
